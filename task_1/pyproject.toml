[project]
name = "task"
version = "0.1.0"
description = ""
authors = [
    {name = "Tabyreto4ka1",email = "sashakorostij@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg2 (>=2.9.13,<3.0.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "fastapi (>=0.136.0,<0.137.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic[email] (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.33,<0.0.34)",
    "bcrypt (<4.1)",
    "redis (>=8.1.0,<9.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "fastapi-mail (>=1.6.8,<2.0.0)",
    "fastapi-limiter (>=0.1.6,<0.2.0)",
    "cloudinary (>=1.47.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "task", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
